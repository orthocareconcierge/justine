<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11161d">
<title>Race Day · Justine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--card:#fff;--card2:#e9edf1;--line:#d3dae1;--tx:#141b23;--tx2:#5d6b79;--tx3:#8794a1;--acc:#0d7d9e;--acc-t:#fff;--food:#a8651a;--win:#2b7f59;--warn:#b8463a;--shadow:0 1px 2px rgba(20,27,35,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--card:#1a222c;--card2:#232e3a;--line:#31404f;--tx:#e9eef3;--tx2:#93a3b2;--tx3:#6f8090;--acc:#49b8d8;--acc-t:#0e151c;--food:#e0a54a;--win:#5fbf8a;--warn:#e5705f;--shadow:none}}
html[data-theme="light"]{--bg:#f3f5f7;--card:#fff;--card2:#e9edf1;--line:#d3dae1;--tx:#141b23;--tx2:#5d6b79;--tx3:#8794a1;--acc:#0d7d9e;--acc-t:#fff;--food:#a8651a;--win:#2b7f59;--warn:#b8463a;--shadow:0 1px 2px rgba(20,27,35,.07)}
html[data-theme="dark"]{--bg:#11161d;--card:#1a222c;--card2:#232e3a;--line:#31404f;--tx:#e9eef3;--tx2:#93a3b2;--tx3:#6f8090;--acc:#49b8d8;--acc-t:#0e151c;--food:#e0a54a;--win:#5fbf8a;--warn:#e5705f;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:96px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:840px;margin:0 auto;padding:0 clamp(14px,3.5vw,24px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 0}
.cd b{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1}
.cd i{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);display:block;margin-top:3px}
.hmid{flex:1 1 auto;min-width:0}
.hmid .p{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.hmid .d{font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabs{max-width:840px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:11px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx3);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;border-top:2px solid transparent;margin-top:-1px}
.tab .g{font-size:16px;line-height:1}
.tab[aria-selected="true"]{color:var(--acc);border-top-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card.flag{border-color:var(--warn)}
.chd{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.chd h2{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;flex:1 1 auto}
.chd .r{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx2);font-weight:600}
.pad{padding:15px}
.sect{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.sect h2{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.sect span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);margin-left:auto}
.hint{font-size:13px;color:var(--tx2);line-height:1.55}
.hint b{color:var(--tx)}
.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:var(--card2);color:var(--tx2)}
.pill.acc{background:var(--acc);color:var(--acc-t)}
.pill.warn{background:var(--warn);color:#fff}
.pill.win{background:var(--win);color:#fff}
.row{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row.on{background:var(--card2)}
.box{width:26px;height:26px;flex:0 0 auto;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;margin-top:1px}
.row.on .box{background:var(--win);border-color:var(--win)}
.box svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0}
.row.on .box svg{opacity:1}
.rbody{flex:1 1 auto;min-width:0}
.rt{font-size:15px;font-weight:600;line-height:1.3;display:block}
.row.on .rt{color:var(--tx2)}
.rx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--acc);font-weight:600;margin-top:3px;display:block}
.rn{font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.45;display:block}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.mac div{background:var(--card);padding:11px 6px;text-align:center}
.mac b{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;display:block}
.mac i{font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:block;margin-top:2px}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
.bar.f>i{background:var(--food)} .bar.g>i{background:var(--win)} .bar.w>i{background:var(--warn)}
.wkhd{display:flex;align-items:center;gap:10px;width:100%;padding:12px 15px;text-align:left}
.wkno{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--tx3)}
.wkdt{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;flex:1 1 auto}
.mini{display:flex;gap:3px}
.mini i{width:9px;height:9px;border-radius:2px;background:var(--card2);display:block}
.mini i.t{background:var(--acc);opacity:.3} .mini i.t.done{opacity:1} .mini i.r{background:var(--line)}
.chev{color:var(--tx3);font-size:11px}
.wkhd[aria-expanded="true"] .chev{transform:rotate(90deg)}
.dayrow{display:flex;gap:11px;align-items:center;padding:10px 15px;border-top:1px solid var(--line);width:100%;text-align:left}
.dd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);width:56px;flex:0 0 auto}
.dl{flex:1 1 auto;font-size:14px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.rest{font-weight:400;color:var(--tx2)}
.dk{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--tx3)}
.fi{padding:13px 15px;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.fi-hd{display:flex;gap:10px;align-items:baseline}
.fi-hd b{font-size:14.5px;font-weight:600;flex:1 1 auto}
.fi-hd span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);white-space:nowrap}
.fi-b{font-size:13px;color:var(--tx2);margin-top:5px;line-height:1.5}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.stat div{background:var(--card);padding:15px 8px;text-align:center}
.stat b{font-family:'IBM Plex Mono',monospace;font-size:25px;font-weight:600;display:block;line-height:1}
.stat i{font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:block;margin-top:6px}
.phrow{padding:13px 15px;border-bottom:1px solid var(--line)}
.phrow:last-child{border-bottom:0}
.phrow .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:600;gap:10px}
.phrow .t span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);font-weight:400;white-space:nowrap}
.inp{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line)}
.inp label{flex:1 1 auto;font-size:14px;font-weight:500}
.inp label small{display:block;font-size:11.5px;color:var(--tx3);font-weight:400;margin-top:2px}
.inp input{width:88px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;text-align:right}
.ref{padding:13px 15px;border-bottom:1px solid var(--line)}
.ref:last-child{border-bottom:0}
.ref b{font-size:14px;font-weight:600;display:block}
.ref cite{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx3);font-style:normal;display:block;margin-top:3px}
.ref p{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.55}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function fatToLoseLb(){return Math.max(0,ME.weightLb-CFG.goalWeightLb);}
function reqDeficit(wks){return wks>0?fatToLoseLb()*3500/(wks*7):0;}

function deficitApplied(){return Math.min(dailyDeficit(),CFG.maxDailyDeficit);}

function ratePct(){return ME.weightLb>0?lbPerWk()/ME.weightLb*100:0;}
function weeksToGoal(){var r=lbPerWk();return r>0?Math.ceil(fatToLoseLb()/r):0;}

    if(workoutFor(d).every(function(x,j){return state["w-"+d.iso+"-"+j];}))streak++;else break;}
  var h='<div class="card"><div class="chd"><h2>Your numbers</h2></div>'+
   '<div class="inp"><label>Bodyweight<small>pounds</small></label><input type="number" id="iW" value="'+ME.weightLb+'" step="0.5"></div>'+
   '<div class="inp"><label>Height<small>inches</small></label><input type="number" id="iH" value="'+ME.heightIn+'" step="0.5"></div>'+
   '<div class="inp"><label>Goal weight<small>pounds</small></label><input type="number" id="iGW" value="'+CFG.goalWeightLb+'" step="1"></div>'+
   '<div class="inp"><label>Activity<small>kcal per lb, not counting workouts. 11 mostly sitting, 12 on your feet, 13 very active</small></label><input type="number" id="iA" value="'+ME.activity+'" step="0.5"></div>'+
   '<div class="inp"><label>Timeline<small>weeks to reach the goal weight</small></label><input type="number" id="iT" value="'+ME.goalWeeks+'" step="1"></div>'+
   '<div class="pad" style="border-bottom:1px solid var(--line)"><button class="pill acc" style="padding:11px 18px;font-size:11px;width:100%" data-save="1">Save these numbers</button></div>'+
   '<div class="inp"><label>Fourth session<small>adds a second easy run on Fridays. The app feeds it, so your deficit and timeline do not change.</small></label>'+
   '<button class="pill '+(ME.fourth?'win':'')+'" style="padding:9px 15px;font-size:11px" data-fourth="1">'+(ME.fourth?'On':'Off')+'</button></div>'+
   '<div class="pad"><p class="hint">Estimated rest day maintenance '+maintenanceFor({kind:"rest",w:1})+' kcal, at '+ME.activity+' kcal per lb of bodyweight plus the day\'s session. '+
   'Protein target '+proteinTarget()+' g, about 0.9 g per lb.</p>'+
   '<p class="hint" style="margin-top:9px"><b>Goal '+CFG.goalWeightLb+' lb means '+fatToLoseLb().toFixed(0)+' lb to lose.</b> Your '+ME.goalWeeks+' week timeline needs a '+dailyDeficit()+' kcal daily deficit'+
   (dailyDeficit()>CFG.maxDailyDeficit?', which is capped at '+CFG.maxDailyDeficit+' so no single day goes too low. ':'. ')+
   'Applied deficit '+deficitApplied()+' kcal per day, or '+lbPerWk().toFixed(2)+' lb per week, which is '+ratePct().toFixed(2)+'% of bodyweight per week. At this rate you reach '+CFG.goalWeightLb+' lb in about '+weeksToGoal()+' weeks.</p>'+
   (ratePct()>CFG.ratePctCap?'<p class="hint" style="color:var(--warn);margin-top:8px">That is faster than about 1% of bodyweight per week. Losing faster tends to cost muscle and strength rather than save time, and it stacks poorly with adding running impact from a low base. Consider a longer timeline.</p>':
   '<p class="hint" style="color:var(--win);margin-top:8px">That is a controlled rate at or under 1% of bodyweight per week, which protects muscle and strength while you lean out.</p>')+
   '<p class="hint" style="margin-top:9px">These are estimates. If the scale is dropping faster than planned over three weeks, the activity factor is set too low, so eat a little more. If it is not moving, nudge it down.</p></div></div>';
  h+='<div class="card"><div class="stat">'+
   '<div><b>'+Math.max(0,Math.ceil((RACE-new Date())/864e5))+'</b><i>days out</i></div>'+
   '<div><b>'+streak+'</b><i>session streak</i></div>'+
   '<div><b>'+(past.length?Math.round(donePast.length/past.length*100):0)+'%</b><i>sessions hit</i></div></div></div>';
  h+='<div class="card"><div class="chd"><h2>Weekly weigh in</h2><span class="r">Sundays</span></div><div class="pad">'+
   '<p class="hint">Log one weight per week, same time and conditions. Read the three week trend, never a single number. Daily fluctuation from fluid and glycogen is larger than a week of real fat loss.</p></div>';
  for(var w=1;w<=Math.min(20,t.w+1);w++){
    h+='<div class="inp"><label>Week '+w+'<small>'+DAYS.filter(function(d){return d.w===w;})[0].date.toLocaleDateString(undefined,{month:"short",day:"numeric"})+'</small></label>'+
     '<input type="number" step="0.1" data-wt="'+w+'" value="'+(weights[w]||"")+'" placeholder="lb"></div>';
  }
  var logged=Object.keys(weights).map(Number).sort(function(a,b){return a-b;});
  if(logged.length>1){
    var first=weights[logged[0]], last=weights[logged[logged.length-1]], ch=last-first;
    var perWk=Math.abs(ch)/(logged[logged.length-1]-logged[0]);
    h+='<div class="pad" style="border-top:1px solid var(--line)"><p class="hint"><b>'+(ch<0?"Down":"Up")+' '+Math.abs(ch).toFixed(1)+' lb</b> across '+(logged[logged.length-1]-logged[0])+' weeks, averaging '+
     perWk.toFixed(2)+' lb per week against a predicted '+lbPerWk().toFixed(2)+'. '+
     (perWk>lbPerWk()*1.15?'You are losing faster than the model predicts, so your activity factor is higher than entered. Raise it and your targets rise with it.':
      perWk<lbPerWk()*0.85?'You are losing slower than predicted, so your activity factor is likely lower than entered.':'Tracking as predicted. The activity factor you entered looks right.')+
      ' You are '+Math.max(0,(last-CFG.goalWeightLb)).toFixed(1)+' lb from goal.</p></div>';
  }
  h+='</div>';
  h+='<div class="card"><div class="chd"><h2>Training completion</h2><span class="r">'+doneAll.length+' / '+tr.length+'</span></div>'+
   '<div class="pad"><div class="bar"><i style="width:'+(doneAll.length/tr.length*100)+'%"></i></div>'+
   '<p class="hint" style="margin-top:9px">'+donePast.length+' of '+past.length+' sessions completed so far. That ratio predicts your race, not the total.</p></div></div>';
  h+='<div class="card"><div class="chd"><h2>By phase</h2></div>';
  PHASES.forEach(function(p){
    var pd=tr.filter(function(d){return d.w>=p.w[0]&&d.w<=p.w[1];});
    var pn=pd.filter(function(d){return workoutFor(d).every(function(x,i){return state["w-"+d.iso+"-"+i];});});
    h+='<div class="phrow"><div class="t">'+p.n+'<span>'+pn.length+' / '+pd.length+'</span></div><div class="bar"><i style="width:'+(pd.length?pn.length/pd.length*100:0)+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<div class="card"><div class="chd"><h2>Sync across devices</h2>'+
   '<span class="pill '+(cfgd()?(live?"win":"warn"):"")+'">'+(cfgd()?(live?"Connected":"Not reaching"):"Solo mode")+'</span></div>'+
   '<div class="pad"><p class="hint">'+
   (cfgd()?(live?"Connected. Your checks follow you between phone and laptop. <b>Anything ticked here is readable by anyone with this site URL.</b>":
   "Keys are saved but the database is not responding. Check the URL and key below. Nothing is lost, everything is still saving to this browser."):
   "Right now everything saves to this browser only. Tick a box on your phone and your laptop will not see it.")+'</p>'+
   '<p class="hint" style="margin-top:9px">To turn sync on: create a free project at supabase.com, add a table called checks, then paste your Project URL and anon public key below. It saves here, no file editing.</p></div>'+
   '<div class="inp"><label>Supabase URL<small>https://yourproject.supabase.co</small></label></div>'+
   '<div class="pad" style="padding-top:0"><input type="text" id="sbU" value="'+esc(SYNC.url)+'" placeholder="https://....supabase.co" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:\'IBM Plex Mono\',monospace;font-size:13px"></div>'+
   '<div class="inp"><label>Anon public key<small>safe in a browser, it is designed to be</small></label></div>'+
   '<div class="pad" style="padding-top:0"><input type="text" id="sbK" value="'+esc(SYNC.key)+'" placeholder="eyJhbGci..." style="width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:\'IBM Plex Mono\',monospace;font-size:13px"></div>'+
   '<div class="pad" style="display:flex;gap:8px"><button class="pill acc" style="padding:11px 18px;font-size:11px;flex:1" data-sync="save">Connect</button>'+
   (cfgd()?'<button class="pill" style="padding:11px 18px;font-size:11px;border:1px solid var(--line)" data-sync="clear">Disconnect</button>':'')+'</div></div>';
  return h;
}
function viewWhy(){
  var h='<div class="card"><div class="pad"><p class="hint">Every prescription in this app traces to something below. The training is the same plan Kelly is running, because you race it together. The nutrition is kept deliberately simple and bodyweight based, since precise body composition numbers are not needed to lose weight sensibly while training.</p></div></div>';
  h+='<div class="card">';
  REFS.forEach(function(r){h+='<div class="ref"><b>'+esc(r.t)+'</b><cite>'+esc(r.c)+'</cite><p>'+esc(r.p)+'</p></div>';});
  h+='</div>';
  h+='<div class="card"><div class="pad"><p class="hint"><b>Limits worth knowing.</b> Calorie targets here are formulas, not measurements, so they start as a best estimate and the weigh-in trend corrects them over the first few weeks. Bodyweight targets ignore body composition entirely, which is fine for general fitness and fat loss but will not tell you whether a stall is muscle gain or a plateau. If you want that level of detail later, an InBody or DEXA scan would add it.</p></div></div>';
  return h;
}
function render(){
  var t=todayD(), day=focus||t;
  document.getElementById("cdN").textContent=Math.max(0,Math.ceil((RACE-new Date())/864e5));
  document.getElementById("hPhase").textContent=day.ph.n+" · Week "+day.w;
  document.getElementById("hDate").textContent=fmt(day.date);
  document.getElementById("view").innerHTML=
   curView==="today"?viewToday():curView==="plan"?viewPlan():curView==="food"?viewFood():curView==="prog"?viewProg():viewWhy();
}
function syncTabs(){[].forEach.call(document.querySelectorAll(".tab"),function(t){t.setAttribute("aria-selected",t.dataset.v===curView);});}
document.addEventListener("click",function(e){
  var c=e.target.closest("[data-ck]");
  if(c){var id=c.dataset.ck,on=!state[id];if(on)state[id]=true;else delete state[id];lsSet();push(id,on);render();return;}
  var w=e.target.closest("[data-wk]"); if(w){var n=+w.dataset.wk;openWk=(openWk===n?-1:n);render();return;}
  var g=e.target.closest("[data-go]"); if(g){focus=DAYS[+g.dataset.go];curView="today";syncTabs();render();scrollTo(0,0);return;}
  var nv=e.target.closest("[data-nav]"); if(nv){var v=nv.dataset.nav;focus=(v==="today")?null:DAYS[+v];render();scrollTo(0,0);return;}
  var sy=e.target.closest("[data-sync]");
  if(sy){
    if(sy.dataset.sync==="clear"){SYNC={url:"",key:""};live=false;lsSet();render();return;}
    var u=(document.getElementById("sbU").value||"").trim().replace(/\/$/,"");
    var kk=(document.getElementById("sbK").value||"").trim();
    SYNC={url:u,key:kk}; lsSet();
    if(cfgd())pull().then(function(){live=true;render();}).catch(function(){live=false;render();});
    else render();
    return;
  }
  var sv=e.target.closest("[data-save]");
  if(sv){var q=function(id){return parseFloat(document.getElementById(id).value);};
    var a=q("iW"),b=q("iH"),gw=q("iGW"),d2=q("iA"),tt=q("iT");
    if(a>0)ME.weightLb=a; if(b>0)ME.heightIn=b; if(gw>0&&gw<a)CFG.goalWeightLb=gw;
    if(d2>=9&&d2<=16)ME.activity=d2; if(tt>0&&tt<=40)ME.goalWeeks=tt;
    ME.set=true; lsSet(); render(); return;}
  var f4=e.target.closest("[data-fourth]");
  if(f4){ME.fourth=!ME.fourth;buildDays();lsSet();render();return;}
  var tb=e.target.closest(".tab"); if(tb){curView=tb.dataset.v;syncTabs();render();scrollTo(0,0);return;}
  if(e.target.closest("#themeBtn")){
    var cu=document.documentElement.getAttribute("data-theme");
    var nx=cu==="dark"?"light":cu==="light"?"":"dark";
    if(nx)document.documentElement.setAttribute("data-theme",nx);else document.documentElement.removeAttribute("data-theme");
    try{localStorage.setItem("justine-theme",nx);}catch(err){}
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="iW"||t.id==="iH"||t.id==="iGW"||t.id==="iA"||t.id==="iT"){
    var g=function(id){return parseFloat(document.getElementById(id).value);};
    var vw=g("iW"),vh=g("iH"),vgw=g("iGW"),va=g("iA"),vt=g("iT");
    if(vw>0)ME.weightLb=vw; if(vh>0)ME.heightIn=vh; if(vgw>0&&vgw<vw)CFG.goalWeightLb=vgw;
    if(va>=9&&va<=16)ME.activity=va; if(vt>0&&vt<=40)ME.goalWeeks=vt;
    ME.set=true; lsSet(); render(); return;
  }
  if(t.dataset.wt){var v=parseFloat(t.value); if(v>0)weights[t.dataset.wt]=v; else delete weights[t.dataset.wt]; lsSet(); render();}
});
lsGet();
try{var th=localStorage.getItem("justine-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
if(cfgd())pull().then(function(){render();setInterval(function(){pull().then(render).catch(function(){});},15000);}).catch(render);
else render();
setInterval(function(){document.getElementById("cdN").textContent=Math.max(0,Math.ceil((RACE-new Date())/864e5));},36e5);
</script>
</body>
</html>
